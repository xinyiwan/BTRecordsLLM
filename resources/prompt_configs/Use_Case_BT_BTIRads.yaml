field_instructions:

  - name: "Radiology Request Reason"
    type: "string"
    options:
      - "Suspicion of tumor"
      - "Metastasis"
      - "Follow-up"
      - "Recurrent tumor"
      - "Incidental finding"
      - "Not specified"
    default: "Not specified"
    chain_order: 1

  - name: "Patient Symptoms"
    type: "list"
    options:
      - "Pain"
      - "Swelling"
      - "Pathological fracture"
      - "Immobilization"
      - "Scoliosis"
      - "Limping"
      - "Cord compression"
      - "Other"
    constraints: "List all symptoms mentioned in the report. Use an empty list if no symptoms are described."
    default: []
    chain_order: 2


  - name: "Is the lesion an incidental finding?"
    type: "string"
    options:
      - "Yes"
      - "No"
    default: "Not specified"
    chain_order: 2


  - name: "Skeletal Location"
    type: "string"
    constraints: "Use a standard UMLS-based anatomical term for the specific bone or skeletal region (e.g., 'Femur', 'Tibia', 'Lumbar spine', 'Proximal humerus'). If there is left and right difference, alaso specify the side."
    default: "Not specified"
    required: true
    chain_order: 3

  - name: "Location within bone"
    type: "string"
    options:
      - "Epiphysis"
      - "Metaphysis"
      - "Diaphysis"
      - "Epiphysis and metaphysis"
      - "Metaphysis and diaphysis"
      - "Not applicable"
      - "Not specified"
    constraints: "If the location within the bone is not mentioned in the report, the label should be not specified. Otherwise, try to match the right location from the report."
    default: "Not specified"
    chain_order: 3

  - name: "Lesion Shape"
    type: "string"
    options:
      - "Round/oval"
      - "Lobulated"
      - "Geographic"
      - "Irregular"
      - "Exophytic"
      - "Not specified"
    constraints: "List the shape of the lesion mentioned in the report. Use not specified if no shape information are described."
    default: "Not specified"
    chain_order: 3

  - name: "Lesion Matrix"
    type: "string"
    options:
      - "Cartilage matrix"
      - "Fibrous matrix"
      - "Fatty tissue"
      - "Mixed"
      - "Fluid"
      - "Vascular"
      - "Viable tissue"
      - "Not specified"
    constraints: |
      The predominant matrix type visible on imaging.
      Bone matrix: sclerotic/osteoid mineralization, cloud-like or ivory density.
      Cartilage matrix: rings-and-arcs calcification, popcorn calcification.
      Fibrous tissue: ground-glass opacity, narrow zone of transition.
      Fatty tissue: signal consistent with fat on MRI or low density on CT.
    default: "Not specified"
    chain_order: 3

  - name: "MRI contrast enhancement"
    type: "list"
    options:
      - "Homogeneous enhancement"
      - "Heterogeneous enhancement"
      - "No enhancement"
      - "Absence/unknown"
    constraints: "List the contrast enhancement situation described in the report if there is contrast enhancement images. Use no enhancement if the report explicitly states no enhancement is present."
    default: []
    chain_order: 4

  - name: "Surrounding bone reaction"
    type: "list"
    options:
      - "Periosteal reaction"
      - "Cortical erosion"
      - "Cortical thickening"
      - "Reactive sclerosis"
      - "Bone marrow edema"
      - "None"
    constraints: "List all bone reactions described in the imaging report. Use an empty list only if the report explicitly states no reaction is present."
    default: []
    chain_order: 4


  - name: "Quality Check"
    type: "string"
    constraints: |
      Evaluate the report for logical consistency and medical plausibility.
      Flag unclear or contradictory findings.
      Briefly explain any quality concerns identified.
    default: "No issues detected"
    chain_order: 7


task: |
  The input reports are in Spanish. All output values must be in English regardless of the input language.
  The output could be from the provided options, it can also be free text interpreted from the reports.
  Extract information into this exact JSON structure:
  ```json
  {
      "Radiology Request Reason": "",
      "Patient Symptoms": [],
      "Is the lesion an incidental finding?": "",
      "Skeletal Location": "",
      "Location within bone": "",
      "Lesion Matrix": "",
      "Surrounding bone reaction": [],
      "Quality Check": ""
  }```

examples:
  - input: |
      anonymized for github
    reasoning: |
      - The clinical indication mentions pain and swelling in the knee for several weeks; therefore "Patient Symptoms" includes ["Pain", "Swelling"].
      - The radiology was ordered to evaluate a suspected tumor, so "Radiology Request Reason" is "Suspicion of tumor".
      - The report describes an aggressive lesion in the distal femur with osteoid matrix production, consistent with osteosarcoma; "Disease Type" is "Osteosarcoma".
      - Osteosarcoma is a primary bone tumor, so "Is it a bone tumor?" is "Yes".
      - The diagnosis is presented as a differential pending biopsy, so "Is it suspected or confirmed?" is "Suspected".
      - The lesion was found because of clinical symptoms, so "Is the lesion an incidental finding?" is "No".
      - The lesion is centered in the distal femur, so "Skeletal Location" is "Distal femur".
      - The lesion is in the metaphysis of the distal femur, so "Location within bone" is "Metaphysis".
      - The report describes cloud-like osteoid mineralization, consistent with "Bone matrix".
      - The report describes periosteal reaction (Codman triangle) and cortical erosion, so "Surrounding bone reaction" is ["Periosteal reaction", "Cortical erosion"].
      - The lesion has an ill-defined border and permeative pattern, so "Margins and bone destruction pattern" is ["Wide transitional zone", "Permeative bone destruction"].
      - The extracted data is internally consistent: an aggressive metaphyseal lesion in the distal femur with osteoid matrix, periosteal reaction, and permeative destruction is characteristic of osteosarcoma. No contradictions.
    output: |
      ```json
      {
        "Radiology Request Reason": "Suspicion of tumor",
        "Patient Symptoms": ["Pain", "Swelling"],
        "Disease Type": "Osteosarcoma",
        "Disease Type differential diagnosis": ["Telangiectatic osteosarcoma", "Chondrosarcoma"],
        "Is it a bone tumor?": "Yes",
        "Is it suspected or confirmed?": "Suspected",
        "Is the lesion an incidental finding?": "No",
        "Is it benign or malignant?": "Malignant",
        "Skeletal Location": "Distal femur",
        "Location within bone": "Metaphysis",
        "Lesion Matrix": "Bone matrix",
        "Surrounding bone reaction": ["Periosteal reaction", "Cortical erosion"],
        "Margins and bone destruction pattern": ["Wide transitional zone", "Permeative bone destruction"],
        "Quality Check": "The extracted data is consistent with the imaging report. The aggressive features are internally coherent with a malignant primary bone tumor. Histological confirmation is pending."
      }```

