      Lesion centered in the intramedullary canal of the proximal femoral diaphysis, with cortical destruction and an associated soft tissue mass, with involvement of the perilesional muscular fascia and the external obturator, vastus medialis, and lateralis muscles. The intramedullary lesion shows predominantly peripheral enhancement, while the adjacent soft tissue mass demonstrates heterogeneous and peripheral enhancement. No prior imaging available for comparison.
    reasoning: |
      - No dimensions are given for the lesion in this excerpt, so "Max Diameter" and "Max Diameter (longest axis, mm)" are "Not specified".
      - No contour/margin descriptor (round, lobulated, irregular) is given, so "Shape" is "Not specified".
      - No plain T1W or fluid-sensitive signal description is given (only post-contrast enhancement is described), so "T1W_intensity", "fluid_sensitive_intensity", and "fluid_sensitive_pattern" are all "Not specified".
      - No fluid/hemorrhage, fat, fibrous, or cartilage/chondroid component is described for this lesion, so "Fluid/Hemorrhage", "Fat", "Fibrous Component", and "Cartilage/Chondroid" are all "Not specified".
      - The intramedullary lesion is described as T1W-hyperintense nowhere, so the signal-drop branch doesn't apply; but this isn't actually determinable either way from this excerpt, so "T1W_FS_CE_signal_drop" is "Not specified".
      - The enhancement is not explicitly labeled as being on a fat-suppressed post-contrast T1W sequence, but "predominantly peripheral enhancement" / "heterogeneous and peripheral enhancement" is clearly a post-contrast enhancement description for this lesion, which is enough even without the sequence being named; the pattern is heterogeneous (mixed peripheral/central), so "T1W_FS_CE_pattern" is "Heterogeneous".
      - The report explicitly describes the soft tissue mass extending into and involving the perilesional fascia and adjacent muscles (obturator, vastus medialis, vastus lateralis) -- this is a clear description of adjacent muscle/fascia involvement even though no signal-intensity or sequence language is used, so "Soft Tissue Invasion" is "Yes".
      - No description of bone marrow signal change adjacent to the lesion is given, so both "perilesional_edema_T1W" and "perilesional_edema_fluid_sensitive" are "Not specified".
    output: |
      ```json
      {
        "Max Diameter": "Not specified",
        "Max Diameter (longest axis, mm)": "Not specified",
        "Shape": "Not specified",
        "T1W_intensity": "Not specified",
